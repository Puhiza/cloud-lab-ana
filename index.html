<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Cloud Page</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #eaf2ff;
      text-align: center;
      padding: 50px;
    }

    main {
      background: white;
      max-width: 600px;
      margin: auto;
      padding: 30px;
      border-radius: 15px;
    }

    h1 {
      color: #174ea6;
    }

    button {
      padding: 10px 18px;
      background-color: #174ea6;
      color: white;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <main>
    <h1>My First Cloud Page</h1>

    <p>Student: shkruaj pseudonimin ose inicialet</p>
    <p>Course: Cloud Technology</p>
    <p>My cloud application idea: shkruaj një ide të shkurtër</p>

    <button onclick="document.getElementById('message').textContent =
      'It works!'">
      Test the page
    </button>

    <p id="message"></p>
  </main>
</body>
</html>
