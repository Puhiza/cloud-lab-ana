<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Two Numbers</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #eef4ff;
      margin: 0;
      padding: 40px 15px;
    }

    .calculator {
      max-width: 400px;
      margin: 50px auto;
      padding: 25px;
      background-color: white;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 12px #0002;
    }

    input {
      width: 80%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #aaa;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      padding: 10px 22px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      background-color: #2563eb;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    #result {
      font-size: 20px;
      font-weight: bold;
      color: #172554;
    }
  </style>
</head>

<body>
  <div class="calculator">
    <h1>Add Two Numbers</h1>

    <input id="number1" type="number" placeholder="Enter the first number">
    <input id="number2" type="number" placeholder="Enter the second number">

    <br>

    <button onclick="addNumbers()">+</button>

    <p id="result"></p>
  </div>

  <script>
    function addNumbers() {
      const number1 = Number(document.getElementById("number1").value);
      const number2 = Number(document.getElementById("number2").value);
      const sum = number1 + number2;

      document.getElementById("result").textContent = "Result: " + sum;
    }
  </script>
</body>
</html>
